name: Test and publish

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  test:
    name: Unit + e2e (dev and prod builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Runner ships a sandbox-ready system Chrome, use it instead of a downloaded one
      - run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

  # Publish when package.json holds a version npm doesn't have yet
  publish:
    name: Publish to npm
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skip if this version is already published
        id: changed
        run: |
          local_version=$(node -p "require('./package.json').version")
          npm view "less-lazy@$local_version" version --silent && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.skip != 'true'
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - if: steps.changed.outputs.skip != 'true'
        run: npm ci && npm publish --access public
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
